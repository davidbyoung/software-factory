# Checks that the factory's copies match the installed version, and that
# the settings in .claude/factory.yaml are sound. A copy under .claude/ or
# .github/ is written by `factory sync` and never edited: edit the source in
# the factory's package, sync, and commit both.
name: Factory check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Factory files in step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compare the copies with their source
        run: npx --no-install factory sync --check

      - name: Check the settings
        run: npx --no-install factory config check
