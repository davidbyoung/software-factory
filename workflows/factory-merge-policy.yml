name: Factory merge policy

# Labels each pull request merge-automatic or merge-manual, by the names
# code-host.labels gives them, from the files it changes, posts the reason as
# the non-blocking "Who merges" status, and turns auto-merge on only for
# merge-automatic ones that are not drafts. `factory merge-policy` holds the
# factory's own files, and reads the label names and the auto-merge lists
# from the settings. It reads
# the pull request as it is now, and the steps use its commit and draft
# state: an event sent just after a push can carry the previous commit.
#
# pull_request_target runs this file, the factory's command, and the
# settings from main, never the pull request's copy, so a pull request cannot
# widen its own allowlist. It
# checks out main and reads the pull request's files through the API; it
# never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: factory-merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  classify:
    name: Classify risk
    # Dependabot's pull requests have their own auto-merge workflow.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The factory's command reads the auto-merge lists in
      # .claude/factory.yaml. This installs from main's lockfile, so a pull
      # request still cannot change how it is judged.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(npx --no-install factory merge-policy "$PR")
          {
            echo "label=$(jq -r .label <<<"$result")"
            echo "other=$(jq -r .other <<<"$result")"
            echo "automatic=$(jq -r .automatic <<<"$result")"
            echo "status=$(jq -r .status <<<"$result")"
            echo "sha=$(jq -r .sha <<<"$result")"
            echo "draft=$(jq -r .draft <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $(jq -r .label <<<"$result")"
            jq -r '.reasons[] | "- \(.)"' <<<"$result"
          } >> "$GITHUB_STEP_SUMMARY"

      # Through the factory's command, which reaches the label the way
      # GitHub serves it, so nothing here calls the issues API.
      - name: Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.classify.outputs.label }}
          OTHER: ${{ steps.classify.outputs.other }}
        run: |
          npx --no-install factory pr label "$PR" --add "$LABEL" >/dev/null
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qxF "$OTHER"; then
            npx --no-install factory pr label "$PR" --remove "$OTHER" >/dev/null
          fi

      # Always success, and not a required check: it says why, in the checks
      # list, without blocking. The merge waits on the label, not on this.
      - name: Post the reason
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.classify.outputs.sha }}
          STATUS: ${{ steps.classify.outputs.status }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f "context=Who merges" -f "description=$STATUS" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      # The owner's token, so the merge it leads to starts cd.yml and the
      # production smoke tests; a merge made with GITHUB_TOKEN starts no
      # workflows. Auto-merge still waits for every required check and for
      # every review thread to be resolved.
      - name: Turn auto-merge on or off
        env:
          GH_TOKEN: ${{ secrets.FACTORY_AUTOMERGE_TOKEN }}
          AUTOMATIC: ${{ steps.classify.outputs.automatic }}
          DRAFT: ${{ steps.classify.outputs.draft }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::FACTORY_AUTOMERGE_TOKEN is not set as an Actions secret."
            exit 1
          fi
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [[ $AUTOMATIC == true && $DRAFT == false ]]; then
            [[ $enabled == true ]] || gh pr merge --auto --squash "$PR_URL"
          elif [[ $enabled == true ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
