# Starts a build for each ticket moved to Ready, for a repository with no
# server to host the poller: one pass of it on a schedule, which
# `factory sync` sets from `builds.poll-minutes`. Each build it starts is a
# run of factory-build.yml of its own, so builds still run side by side.
#
# GitHub's own token cannot reach a user's Project, so the pass reads the
# board, comments, and starts builds with FACTORY_BOARD_TOKEN, the token
# the board sync already uses. A schedule runs the default branch's copy.
name: Factory poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A late run waits for the one before it, so two passes never read the
# same Ready card before either has posted its start comment.
concurrency:
  group: factory-poller
  cancel-in-progress: false

jobs:
  poll:
    name: Start the Ready tickets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Start the Ready tickets
        env:
          FACTORY_BOARD_TOKEN: ${{ secrets.FACTORY_BOARD_TOKEN }}
        run: npx --no-install factory poller --once
