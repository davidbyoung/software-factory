name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it on main's commit before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Tests, types, format, and the packed package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Validate specs
        run: npm run spec:validate

      # Fails under the coverage floors in vitest.config.ts.
      - name: Run the unit tests, with coverage
        run: npm run coverage

      # Release calls this workflow, and there github.event_name is the
      # caller's, workflow_dispatch: testing for workflow_call never matches.
      - name: Upload the coverage to Codecov
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Packs the package, installs the tarball into an empty repository,
      # runs it there, and fails when a packed file names the repository the
      # factory was drawn out of.
      - name: Check the packed package
        run: npm run pack-check

  site:
    name: The site comparison, with a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Compare the sample sites
        run: npm run site-check
