# Written by `factory sync`. Do not edit: change .claude/factory.yaml and
# run it again.
#
# Everything the factory runs from the default branch's copy: the
# review's verdict, who merges, the board sync, the poller, a build, an
# answer to a review, the conflict sweep, Dependabot's pull requests, and
# updates. The jobs are in the factory's own repository, at the version
# below. A job whose part is off in the settings is skipped.
name: Factory
run-name: "${{ inputs.ticket && format(contains(inputs.ticket, '/') && 'Build {0}' || 'Build #{0}', inputs.ticket) || inputs.job == 'answer' && format('Answer #{0}', inputs.pr) || github.event_name == 'pull_request_target' && format('#{0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || '' }}"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
      - labeled
      - unlabeled
      - edited
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  schedule:
    - cron: "0 1,13,19 * * *" # Dependabot's pull requests, and updates
    - cron: "0 7 * * *" # the board sync
    - cron: "0 9 * * *" # the conflict sweep
  workflow_dispatch:
    inputs:
      job:
        description: "What to run: build, answer, conflicts, dependencies, updates, board, or poller"
        type: string
      ticket:
        description: The ticket's key, for a build
        type: string
      pr:
        description: The pull request's number, to answer its checks or a review
        type: string
      review:
        description: The review's number, to answer a review
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  packages: read
  pull-requests: write
  statuses: write

jobs:
  factory:
    uses: ./.github/workflows/run.yml
    with:
      parts: "review board approval-policies"
      job: ${{ inputs.job }}
      ticket: ${{ inputs.ticket }}
      pr: ${{ inputs.pr }}
      review: ${{ inputs.review }}
    secrets:
      build-token: ${{ secrets.FACTORY_BUILD_TOKEN || secrets.FACTORY_BOARD_TOKEN }}
      board-token: ${{ secrets.FACTORY_BOARD_TOKEN }}
      automerge-token: ${{ secrets.FACTORY_AUTOMERGE_TOKEN }}
      app-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      signing-key: ${{ secrets.FACTORY_SIGNING_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
