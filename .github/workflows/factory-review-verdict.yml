name: Factory review verdict

# Posts the "Review verdict" commit status, which records what the Claude
# review concluded about one commit: success only when its summary for that
# commit says ready, or an approver overrode it. `factory review verdict`
# holds every rule.
#
# Both triggers run this file and the script from main, so a pull request
# cannot change how its own verdict is decided.
on:
  workflow_run:
    workflows: [Claude review]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  verdict:
    name: Record the verdict
    # Label events matter only for the override; the merge-policy workflow's own
    # labels are added with GITHUB_TOKEN and start no runs.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'verdict-override'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Main's lockfile, with no install scripts, so a pull request cannot
      # change how its verdict is decided.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install factory review verdict
