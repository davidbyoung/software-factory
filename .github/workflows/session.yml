# One unattended session, for the jobs of run.yml that start one: a build, a
# review, an answer, a conflict, and a dependency. A repository's own
# factory.yml reaches it through run.yml, so everything here runs in that
# repository, from its default branch's copy.
#
# It is three jobs, each on a machine of its own, so that the AI and a
# sign-in to the code host are never on the same one:
#
#   prepare   has the sign-in: claims the ticket, and hands over files
#   session   has the AI, in its sandbox, and no sign-in of any kind
#   publish   has the sign-in: checks what the session left, and does it
#
# The sign-in is a token of the organization's own GitHub App, where its key
# and the variable FACTORY_APP_CLIENT_ID both reach the run, and otherwise
# the build token. The workflow's own token is never used to push or to open
# a pull request, since GitHub starts no CI for what that token does.
name: Factory session

on:
  workflow_call:
    inputs:
      kind:
        description: "Which session: build, review, answer, conflict, or dependency"
        required: true
        type: string
      id:
        description: The ticket's key, for a build, and the pull request's number for any other
        required: true
        type: string
      review:
        description: The review a person left, for an answer to it
        type: string
        default: ""
      prompt:
        description: What the session is told
        required: true
        type: string
      minutes:
        description: How long the session may run. It is stopped then, so that the job's last steps still run before the job's own limit.
        required: true
        type: number
      limit:
        description: The session job's own limit, in minutes
        required: true
        type: number
    secrets:
      build-token:
        required: false
      app-key:
        required: false
      claude-token:
        required: false
      claude-api-key:
        required: false
      extra:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: none
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      ran: ${{ steps.prepare.outputs.ran }}
    steps:
      # Git asks the GitHub CLI for a sign-in, so the checkout stores none.
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - &install
        name: Install the factory
        run: |
          if [ "$(jq -r '.name // empty' package.json 2> /dev/null)" = "@davidbyoung/software-factory" ]; then
            npm ci --ignore-scripts
            npm link
          else
            version="$(sed -n 's/^version: *//p' .claude/factory.lock | head -n 1)"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::.claude/factory.lock names no release of the factory. Run factory sync, and commit what it writes."
              exit 1
            fi
            npm install --global --no-audit --no-fund "@davidbyoung/software-factory@$version"
          fi

      - name: Check whether there is work, then the tokens
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_BUILD_TOKEN_SET: ${{ secrets.build-token != '' }}
          FACTORY_APP_KEY_SET: ${{ secrets.app-key != '' && vars.FACTORY_APP_CLIENT_ID != '' }}
          FACTORY_CLAUDE_SET: ${{ secrets.claude-token != '' || secrets.claude-api-key != '' }}
          KIND: ${{ inputs.kind }}
          ID: ${{ inputs.id }}
          REVIEW: ${{ inputs.review }}
        # REVIEW is empty or a number, and an empty word is not passed on.
        run: factory session ready "$KIND" "$ID" ${REVIEW:+"$REVIEW"}

      # Under the app, its token signs the GitHub CLI and git in for the rest
      # of this job. No AI and nothing a pull request holds runs in it.
      - name: Sign in
        id: app
        if: steps.gate.outputs.ran == 'true'
        env:
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.app-key }}
          # A review reads, so the workflow's own token will do for it.
          TOKEN: ${{ secrets.build-token || (inputs.kind == 'review' && github.token) || '' }}
        run: |
          if [ -n "$FACTORY_APP_CLIENT_ID" ] && [ -n "$FACTORY_APP_PRIVATE_KEY" ]; then
            factory session token
          else
            printf '%s\n' "$TOKEN" | gh auth login --with-token
            gh auth setup-git
          fi

      # Claude is a session's author. Its committer is the app's bot, or the
      # account that owns the build token, each by its no-reply address.
      - name: Name the committer
        if: steps.gate.outputs.ran == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.slug }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" = review ]; then
            # A review commits nothing.
            name=Claude
            email=noreply@anthropic.com
          elif [ -n "$APP_SLUG" ]; then
            name="$APP_SLUG[bot]"
            email="$(gh api "/users/$APP_SLUG[bot]" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"
          else
            user="$(gh api user)"
            name="$(jq -r '.name // .login' <<< "$user")"
            email="$(jq -r '"\(.id)+\(.login)@users.noreply.github.com"' <<< "$user")"
          fi
          { echo "FACTORY_COMMITTER_NAME=${name//$'\n'/ }"; echo "FACTORY_COMMITTER_EMAIL=$email"; } >> "$GITHUB_ENV"

      # The presets the lock names are handed over too, in the cache the
      # factory reads them from.
      - name: Hand over what the session works from
        id: prepare
        if: steps.gate.outputs.ran == 'true'
        env:
          FACTORY_RUN: ${{ runner.temp }}/factory
          FACTORY_APP_SLUG: ${{ steps.app.outputs.slug }}
          KIND: ${{ inputs.kind }}
          ID: ${{ inputs.id }}
        run: |
          XDG_CACHE_HOME="$FACTORY_RUN/in/cache" factory sync --check > /dev/null || true
          factory session prepare "$KIND" "$ID"

      - name: Hand it to the session
        if: steps.prepare.outputs.ran == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: in-${{ inputs.kind }}
          path: ${{ runner.temp }}/factory/in
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  session:
    name: Session
    needs: prepare
    if: needs.prepare.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.limit }}
    # Only for the repository's own packages, which the install below reads,
    # and no command of the session's is given it.
    permissions:
      packages: read
    cache-mode: none
    env:
      FACTORY_RUN: ${{ github.workspace }}
    steps:
      # GitHub does not always list an artifact as soon as it has it.
      - name: Take what was handed over
        id: take
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: in-${{ inputs.kind }}
          path: in

      - name: Wait for it to be listed
        if: steps.take.outcome == 'failure'
        run: sleep 20

      - name: Take what was handed over again
        if: steps.take.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: in-${{ inputs.kind }}
          path: in

      # The session starts in the default branch, and so does everything
      # below, so nothing on the branch it works on runs outside its sandbox.
      - name: Lay out the default branch
        run: |
          git init -q home
          git -C home fetch -q "$GITHUB_WORKSPACE/in/home.bundle" refs/handoff/home:refs/handoff/home
          git -C home checkout -q -B "$(jq -r .defaultBranch in/run.json)" refs/handoff/home

      - name: Read what the repository installs with
        id: node
        working-directory: home
        run: |
          if [ -f package.json ] && jq -e '.engines.node' package.json > /dev/null; then
            echo "file=home/package.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package-lock.json ]; then echo "lock=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ steps.node.outputs.file }}
          node-version: ${{ steps.node.outputs.file == '' && '22' || '' }}

      - name: Install the factory
        working-directory: home
        run: |
          if [ "$(jq -r '.name // empty' package.json 2> /dev/null)" = "@davidbyoung/software-factory" ]; then
            npm ci
            npm link
            echo "FACTORY_INSTALL=$PWD:$(npm root --global)" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^version: *//p' .claude/factory.lock | head -n 1)"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::.claude/factory.lock names no release of the factory. Run factory sync, and commit what it writes."
              exit 1
            fi
            npm install --global --no-audit --no-fund "@davidbyoung/software-factory@$version"
            echo "FACTORY_INSTALL=$(npm root --global)" >> "$GITHUB_ENV"
          fi

      - name: Take the repository's own secrets
        env:
          EXTRA: ${{ secrets.extra }}
        run: |
          [ -n "$EXTRA" ] || exit 0
          end="FACTORY_$(openssl rand -hex 8)"
          for name in $(jq -r 'to_entries[] | select(.value != "") | .key' <<< "$EXTRA"); do
            value="$(jq -r --arg name "$name" '.[$name]' <<< "$EXTRA")"
            while IFS= read -r line; do
              [ -z "$line" ] || echo "::add-mask::$line"
            done <<< "$value"
            { echo "$name<<$end"; echo "$value"; echo "$end"; } >> "$GITHUB_ENV"
          done

      - name: Install the repository's dependencies
        if: steps.node.outputs.lock == 'true'
        working-directory: home
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Run the build's setup commands
        working-directory: home
        run: |
          factory config get commands.build-setup > "$RUNNER_TEMP/build-setup"
          while IFS= read -r command; do
            echo "::group::$command"
            bash -eo pipefail -c "$command" < /dev/null
            echo "::endgroup::"
          done < "$RUNNER_TEMP/build-setup"

      # Claude Code's sandbox needs these, and Ubuntu lets bubblewrap make a
      # user namespace only with a profile that says so
      # (https://code.claude.com/docs/en/sandboxing). The distribution's own
      # profile for it does not, so it goes first.
      - name: Set up the sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat ripgrep > /dev/null
          for profile in /etc/apparmor.d/*bwrap*; do
            [ -f "$profile" ] || continue
            sudo apparmor_parser -R "$profile"
            sudo rm "$profile"
          done
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo systemctl reload apparmor

      # A factory release changes this pin.
      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.325

      # Exactly one Claude credential reaches the session: the subscription
      # token when it is set, and the API key otherwise. It is kept from
      # every command the session runs.
      - name: Run the session
        id: session
        working-directory: home
        env:
          MINUTES: ${{ inputs.minutes }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ vars.FACTORY_BUILD_MODEL }}
          OAUTH_TOKEN_INPUT: ${{ secrets.claude-token }}
          API_KEY_INPUT: ${{ secrets.claude-api-key }}
        run: |
          if [ -n "$OAUTH_TOKEN_INPUT" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN_INPUT"
          elif [ -n "$API_KEY_INPUT" ]; then
            export ANTHROPIC_API_KEY="$API_KEY_INPUT"
          fi
          unset OAUTH_TOKEN_INPUT API_KEY_INPUT
          factory session run

      # What `factory session run` kept, and nothing the session named. A
      # build that is refused keeps its commits here.
      - name: Hand on what the session left
        if: always() && steps.session.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: out-${{ inputs.kind }}
          path: clean
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, session]
    if: always() && needs.prepare.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    cache-mode: none
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - *install

      # A job's own `env` cannot read the runner's folder.
      - name: Name the run's folder
        run: echo "FACTORY_RUN=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"

      - name: Take what was handed over
        uses: actions/download-artifact@v7
        with:
          name: in-${{ inputs.kind }}
          path: ${{ runner.temp }}/factory/in

      - name: Take what the session left
        if: needs.session.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: out-${{ inputs.kind }}
          path: ${{ runner.temp }}/factory/out

      # The review is recorded with the workflow's own token, which the rule
      # that requires "Review verdict" names.
      - name: Record the review
        id: record
        if: inputs.kind == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ needs.session.result }}
        run: factory session publish

      - name: Sign in
        id: app
        if: inputs.kind != 'review' || steps.record.outputs.next == 'true'
        env:
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.app-key }}
          BUILD_TOKEN: ${{ secrets.build-token }}
        run: |
          if [ -n "$FACTORY_APP_CLIENT_ID" ] && [ -n "$FACTORY_APP_PRIVATE_KEY" ]; then
            factory session token
          elif [ -n "$BUILD_TOKEN" ]; then
            printf '%s\n' "$BUILD_TOKEN" | gh auth login --with-token
            gh auth setup-git
          else
            echo "No build token is set, so no answer starts."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Start the next answer
        if: inputs.kind == 'review' && steps.app.outputs.signed == 'true'
        env:
          ID: ${{ inputs.id }}
        run: factory session next "$ID"

      # The app's key is here to sign in again: waiting for CI can outlast
      # its token. Nothing the session made runs in this job.
      - name: Publish what the session left
        if: inputs.kind != 'review'
        env:
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.app-key }}
          CONCLUSION: ${{ needs.session.result }}
        run: factory session publish
