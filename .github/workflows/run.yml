      limit: ${{ inputs.review-limit }}
      prompt: |
        Answer what pull request ${{ inputs.pr || github.event.pull_request.number }} is waiting on, by its checks, its threads, and, when a number follows, a person's review ${{ inputs.review || github.event.review.id }}, with the Skill tool: invoke `factory-address-review` with the pull request's number. Push once, and end.

