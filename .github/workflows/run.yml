      # Git pushes with the token its checkout stored, so the checkout is
      # made again with the app's. Nothing is cleaned: in the factory's own
      # repository the factory runs from this checkout.
      - name: Give git the app's token
        if: steps.app.outputs.token != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false
          token: ${{ steps.app.outputs.token }}

      # The committer is the account that owns the build token, as for a
      # build, and its commits are signed when the signing key is set. Under
      # the app the committer is the app's bot, and nothing is signed: a
      # person's key cannot vouch for a bot's commit.
      - name: Open the pull requests
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.build-token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SIGNING_KEY_INPUT: ${{ secrets.signing-key }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No build token is set, so no update's pull request is opened. factory doctor shows when you are behind."
            exit 0
          fi
          if [ -n "$APP_SLUG" ]; then
            id="$(gh api "/users/$APP_SLUG[bot]" --jq .id)"
            git config --global user.name "$APP_SLUG[bot]"
            git config --global user.email "$id+$APP_SLUG[bot]@users.noreply.github.com"
          else
            user="$(gh api user)"
            login="$(jq -r .login <<< "$user")"
            git config --global user.name "$(jq -r '.name // .login' <<< "$user")"
            git config --global user.email "$(jq -r .id <<< "$user")+$login@users.noreply.github.com"
            if [ -n "$SIGNING_KEY_INPUT" ]; then
              key_file="$RUNNER_TEMP/factory-signing-key"
              (umask 077; printf '%s\n' "$SIGNING_KEY_INPUT" > "$key_file")
              chmod 600 "$key_file"
              git config --global gpg.format ssh
              git config --global user.signingkey "$key_file"
              git config --global commit.gpgsign true
            fi
          fi
          factory update --pull-requests

  unknown:
    name: Unknown job
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.job != '' &&
      !contains(fromJSON('["build", "review", "answer", "conflicts", "conflict", "dependencies", "dependency", "updates", "board", "poller", "order"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say which job was asked for
        env:
          JOB: ${{ inputs.job }}
        run: |
          echo "::error::Unknown job $JOB. It is one of build, review, answer, conflicts, conflict, dependencies, dependency, updates, board, poller, or order."
          exit 1
