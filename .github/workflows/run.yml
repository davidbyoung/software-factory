      group: factory-deps
      cancel-in-progress: false
    steps: *each

  dependency:
    name: Dependency
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.job == 'dependency'
    uses: ./.github/workflows/session.yml
    concurrency:
      group: factory-dependency-${{ inputs.pr }}
      cancel-in-progress: false
    permissions: *session-permissions
    with:
      kind: dependency
      id: ${{ inputs.pr }}
      minutes: ${{ inputs.dependencies-minutes }}
      limit: ${{ inputs.dependencies-limit }}
      prompt: |
        Look after Dependabot's pull request ${{ inputs.pr }} with the Skill tool: invoke `factory-deps` with the pull request's number. Push once if it needs a change, and end.

