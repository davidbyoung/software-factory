# What has to read a pull request's own code: the check that lunamill's
# files match the settings. A repository's own
# .github/workflows/lunamill-review.yml, which `lunamill sync` writes, calls
# this file on `pull_request`, at the version its lock names. GitHub runs it
# from the pull request's copy, so it is given no secret and may only read:
# everything that decides or posts is run.yml's, from the default branch's.
# It also checks that lunamill.yml is enabled: GitHub switches a workflow with
# a schedule off in a public repository that goes quiet, and this one's
# caller has none.
name: Lunamill review run

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  # Checks that Lunamill's copies match the version the lock names, and
  # that the settings in .claude/lunamill.yaml are sound. A copy under
  # .claude/ or .github/ is written by `lunamill sync` and never edited.
  check:
    name: Lunamill files in step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The version the pull request's own lock names, which is the one its
      # copies were written by: an update's pull request names a newer one
      # than the default branch does.
      - name: Install Lunamill
        run: |
          if [ "$(jq -r '.name // empty' package.json 2> /dev/null)" = "@lunamill-ai/lunamill" ]; then
            npm ci --ignore-scripts
            npm link
          else
            version="$(sed -n 's/^version: *//p' .claude/lunamill.lock | head -n 1)"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::.claude/lunamill.lock names no release of Lunamill. Run lunamill sync, and commit what it writes."
              exit 1
            fi
            npm install --global --no-audit --no-fund "@lunamill-ai/lunamill@$version"
          fi

      # The base commit's lock is what a preset's pin is compared with. This
      # job has no sign-in but the workflow's own token, so a private preset is
      # compared after the merge.
      - name: Compare the copies with their source
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" fetch --no-tags --depth 1 origin "$BASE"
          unset TOKEN
          lunamill sync --check --against "$BASE" --public

      - name: Check the settings
        run: lunamill config check

      - name: Check that lunamill.yml is enabled
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fix="so nothing posts \"Review verdict\" here. Enable it on the Actions tab, or run: gh workflow enable lunamill.yml. Then push a commit to this pull request."
          error="$RUNNER_TEMP/factory-yml-error"
          if ! state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lunamill.yml" --jq .state 2> "$error")"; then
            reason="$(tail -n 1 "$error")"
            case "$reason" in
              *"(HTTP 404)") echo "lunamill.yml is not on the default branch yet" ;;
              *) echo "::warning::Could not tell whether lunamill.yml is enabled: ${reason#gh: }" ;;
            esac
            exit 0
          fi
          case "$state" in
            active) echo "lunamill.yml is enabled" ;;
            disabled_fork) echo "lunamill.yml is off in this fork" ;;
            disabled_inactivity)
              echo "::error::GitHub switched lunamill.yml off after 60 days with no activity, $fix"
              exit 1
              ;;
            disabled_*)
              echo "::error::lunamill.yml is disabled, $fix"
              exit 1
              ;;
            *) echo "::warning::Could not tell whether lunamill.yml is enabled: its state is $state" ;;
          esac
