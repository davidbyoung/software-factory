# What has to read a pull request's own code: the check that the factory's
# files match the settings. A repository's own
# .github/workflows/factory-review.yml, which `factory sync` writes, calls
# this file on `pull_request`, at the version its lock names. GitHub runs it
# from the pull request's copy, so it is given no secret and may only read:
# everything that decides or posts is run.yml's, from the default branch's.
name: Factory review run

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Checks that the factory's copies match the version the lock names, and
  # that the settings in .claude/factory.yaml are sound. A copy under
  # .claude/ or .github/ is written by `factory sync` and never edited.
  check:
    name: Factory files in step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The version the pull request's own lock names, which is the one its
      # copies were written by: an update's pull request names a newer one
      # than the default branch does.
      - name: Install the factory
        run: |
          if [ "$(jq -r '.name // empty' package.json 2> /dev/null)" = "@davidbyoung/software-factory" ]; then
            npm ci --ignore-scripts
            npm link
          else
            version="$(sed -n 's/^version: *//p' .claude/factory.lock | head -n 1)"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::.claude/factory.lock names no release of the factory. Run factory sync, and commit what it writes."
              exit 1
            fi
            npm install --global --no-audit --no-fund "@davidbyoung/software-factory@$version"
          fi

      # The base commit's lock is what a preset's pin is compared with. This
      # job has no sign-in, so a private preset is compared after the merge.
      - name: Compare the copies with their source
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" fetch --no-tags --depth 1 origin "$BASE"
          unset TOKEN
          factory sync --check --against "$BASE" --public

      - name: Check the settings
        run: factory config check
