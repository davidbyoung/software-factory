# Publishes a version to npm when its tag is pushed: `git tag v0.2.0 &&
# git push origin v0.2.0`, once that version's pull request has merged.
# The whole CI runs on the tagged commit first, and the version publishes
# only when it passes, the tag matches package.json, and main has the
# commit.
# Then it publishes the poller's image of that version to GitHub's
# container registry.
#
# It publishes as this repository's trusted publisher, set on the package's
# page on npmjs.com, so no token is stored. Where that is not set up, the
# NPM_TOKEN secret is used instead: a granular token that may publish this
# one package. No provenance is attached, since npm gives it only to a
# public repository.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so main's ancestry reaches the tagged commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check main has the tagged commit
        id: on-main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $GITHUB_REF_NAME is on a commit main does not have. Nothing was published."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Check the tag matches the package's version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json's version, $version. Nothing was published."
            exit 1
          fi
          echo "Publishing $version."

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    name: Publish the poller's image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The registry can take a moment to serve a version it has just
      # accepted, and the image installs it from there.
      - name: Wait for the version on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            npm view "@davidbyoung/software-factory@$version" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm did not serve $version within five minutes. No image was published."
          exit 1

      - name: Log in to GitHub's container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -f poller.Dockerfile --build-arg VERSION="$version" \
            -t "ghcr.io/davidbyoung/software-factory-poller:$version" \
            -t "ghcr.io/davidbyoung/software-factory-poller:latest" .
          docker push "ghcr.io/davidbyoung/software-factory-poller:$version"
          docker push "ghcr.io/davidbyoung/software-factory-poller:latest"
