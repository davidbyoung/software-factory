# The review that reads every pull request once it is marked ready, and
# every push after that, with the instructions in .github/factory-review.md.
# The commands it may run beyond reading and commenting are the settings'
# `pr-review.commands`, read from the pull request's base commit
# (`factory review tools`). Its credential is CLAUDE_CODE_OAUTH_TOKEN, or
# ANTHROPIC_API_KEY when that is the one set, and
# FACTORY_BUILD_MODEL, a repository variable, chooses the model as it does
# for the factory's other sessions.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes the review of the one before it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review:
    name: Claude review
    # Drafts are not ready for review. A fork's pull request gets no
    # secrets, and a Dependabot pull request gets Dependabot's secrets, not
    # the Actions ones, so neither could authenticate.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The event's commit can be stale: a "marked ready" event sent just
      # after a push carries the previous commit. Review the head as it is.
      - name: Find the current head
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pull request's own head, not GitHub's default merge commit,
          # which also holds whatever reached main since: a later review
          # would comment on changes that are not part of the pull request.
          ref: ${{ steps.head.outputs.sha }}
          # The whole history, so a later push can be reviewed against the
          # commit the previous review covered.
          fetch-depth: 0

      # So the reviewer can run the commands its settings allow, such as the
      # unit tests, to confirm a finding before posting it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The review action restores CLAUDE.md and the other instruction files
      # it knows from the base branch, but not these two, which the review
      # prompt points at. Taking them from the base commit keeps a pull
      # request from editing the instructions its own review follows. A
      # file the base commit does not have is left as the pull request has
      # it, so a pull request that adds one is still reviewed by it.
      - name: Read the review instructions from the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for file in .github/factory-review.md .github/review-notes.md; do
            if git cat-file -e "$BASE:$file" 2>/dev/null; then
              git checkout "$BASE" -- "$file"
              echo "Restored $file from $BASE."
            else
              echo "Left $file as the pull request has it: $BASE does not have it."
            fi
          done

      # From the base commit too, so a change to the settings alone cannot
      # widen the commands its own review may run. Its lock holds them, from
      # a preset as well; a lock written before presets holds no settings,
      # and then the base commit's settings file does.
      - name: List the tools the review may use
        id: tools
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FACTORY_SETTINGS: ${{ runner.temp }}/factory.yaml
        run: |
          if git show "$BASE:.claude/factory.lock" > "$RUNNER_TEMP/factory.lock" 2>/dev/null &&
            grep -q '^settings:' "$RUNNER_TEMP/factory.lock"; then
            export FACTORY_LOCK="$RUNNER_TEMP/factory.lock"
          elif git cat-file -e "$BASE:.claude/factory.yaml" 2>/dev/null; then
            git show "$BASE:.claude/factory.yaml" > "$FACTORY_SETTINGS"
          else
            cp .claude/factory.yaml "$FACTORY_SETTINGS"
          fi
          echo "allowed=$(npx --no-install factory review tools)" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The API key only when there is no subscription token, so a
          # repository with both is never billed by the key.
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ steps.head.outputs.sha }}

            Follow the review instructions in .github/factory-review.md.
          claude_args: |
            ${{ vars.FACTORY_BUILD_MODEL && format('--model {0}', vars.FACTORY_BUILD_MODEL) || '' }}
            --max-turns 40
            --allowedTools "${{ steps.tools.outputs.allowed }}"

      # Adds what the review cost at API list prices to its summary comment,
      # for the board's Cost (`factory review cost`). It logs and passes
      # when there is no summary or no figure.
      - name: Record the review's cost
        if: ${{ !cancelled() && steps.review.outputs.execution_file != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.head.outputs.sha }}
        run: npx --no-install factory review cost
