# Runs a Claude Code session in GitHub Actions: everything a run needs
# before and around the session. The workflow that calls it checks the
# repository out first, since a local action is read from the checkout, and
# passes each secret as an input, since a composite action cannot read
# secrets.
name: Factory agent
description: Sets up the repository and runs one unattended Claude Code session.

inputs:
  prompt:
    description: What the session is told
    required: true
  minutes:
    description: How long the session may run, in minutes. The shell stops it then, so that the job's last steps still run before the job's own limit.
    required: true
  only-if:
    description: A command run after the install and before the setup commands, with the build token as GH_TOKEN. When it exits 1 the action prints what it printed, says there is nothing to do, and runs no setup and no session; on any other non-zero exit it fails the step with what the command printed. Without it a session always runs.
    required: false
    default: ""
  github-token:
    description: The token the session acts with, on GitHub and in git
    required: true
  claude-oauth-token:
    description: Claude's subscription token
    required: false
    default: ""
  anthropic-api-key:
    description: Claude's API key, used when there is no subscription token
    required: false
    default: ""
  model:
    description: The model, when the tool's default is not wanted
    required: false
    default: ""
  signing-key:
    description: A private SSH key that signs the session's commits, when there is one
    required: false
    default: ""

outputs:
  installed:
    description: "true once npm ci has succeeded, so a workflow's last step knows the checkout is usable"
    value: ${{ steps.install.outputs.installed }}
  ran:
    description: "false when the only-if command found nothing to do"
    value: ${{ steps.gate.outputs.ran }}

runs:
  using: composite
  steps:
    # An unset secret arrives as an empty string.
    - name: Check the credentials
      shell: bash
      env:
        BUILD_TOKEN: ${{ inputs.github-token }}
        OAUTH_TOKEN_INPUT: ${{ inputs.claude-oauth-token }}
        API_KEY_INPUT: ${{ inputs.anthropic-api-key }}
      run: |
        if [ -z "$BUILD_TOKEN" ]; then
          echo "::error::No build token: set the secret FACTORY_BUILD_TOKEN, or FACTORY_BOARD_TOKEN."
          exit 1
        fi
        if [ -z "$OAUTH_TOKEN_INPUT" ] && [ -z "$API_KEY_INPUT" ]; then
          echo "::error::No Claude credential: set the secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
          exit 1
        fi

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - name: Install dependencies
      id: install
      shell: bash
      run: |
        npm ci
        echo "installed=true" >> "$GITHUB_OUTPUT"

    # A composite action cannot end early, so every later step tests `ran`.
    - name: Check whether there is work
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ONLY_IF: ${{ inputs.only-if }}
      run: |
        if [ -z "$ONLY_IF" ]; then
          echo "ran=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        status=0
        output="$(bash -c "$ONLY_IF" < /dev/null 2>&1)" || status=$?
        [ -z "$output" ] || printf '%s\n' "$output"
        if [ "$status" -eq 0 ]; then
          echo "ran=true" >> "$GITHUB_OUTPUT"
        elif [ "$status" -eq 1 ]; then
          echo "Nothing to do."
          echo "ran=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::The check exited $status, so it could not tell whether there is work."
          exit "$status"
        fi

    - name: Run the build's setup commands
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      run: |
        npx --no-install factory config get build-setup > "$RUNNER_TEMP/build-setup"
        while IFS= read -r command; do
          echo "::group::$command"
          bash -eo pipefail -c "$command" < /dev/null
          echo "::endgroup::"
        done < "$RUNNER_TEMP/build-setup"

    # Claude is the author. The committer is the account that owns the build
    # token, by its no-reply address, which GitHub ties to the account: it
    # must be, for a signature by that account's key to show as verified.
    - name: Set git's name and email
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        user="$(gh api user)"
        login="$(jq -r .login <<< "$user")"
        git config --global user.name "$(jq -r '.name // .login' <<< "$user")"
        git config --global user.email "$(jq -r .id <<< "$user")+$login@users.noreply.github.com"
        git config --global author.name "Claude"
        git config --global author.email "noreply@anthropic.com"

    # The key goes to a file under RUNNER_TEMP, which the runner empties when
    # the job ends, readable only by the runner's user. Nothing taken from it
    # is echoed: GitHub masks the secret, and the script prints no part of it.
    - name: Set up commit signing
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      env:
        SIGNING_KEY_INPUT: ${{ inputs.signing-key }}
      run: |
        if [ -z "$SIGNING_KEY_INPUT" ]; then
          echo "No signing key: this build's commits will be unsigned."
          exit 0
        fi
        key_file="$RUNNER_TEMP/factory-signing-key"
        (umask 077; printf '%s\n' "$SIGNING_KEY_INPUT" > "$key_file")
        chmod 600 "$key_file"
        git config --global gpg.format ssh
        git config --global user.signingkey "$key_file"
        git config --global commit.gpgsign true

    # A factory release changes this pin.
    - name: Install Claude Code
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.325

    # The session may switch the checkout to another branch, and the runner
    # reads this action's file again when a step ends, so the checkout goes
    # back to this commit after the session.
    - name: Record the commit the session starts on
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      run: git rev-parse HEAD > "$RUNNER_TEMP/factory-start-commit"

    # Exactly one Claude credential reaches the session: the subscription
    # token when it is set, and the API key otherwise.
    - name: Run the session
      if: steps.gate.outputs.ran != 'false'
      shell: bash
      env:
        MINUTES: ${{ inputs.minutes }}
        GH_TOKEN: ${{ inputs.github-token }}
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        OAUTH_TOKEN_INPUT: ${{ inputs.claude-oauth-token }}
        API_KEY_INPUT: ${{ inputs.anthropic-api-key }}
        # Tells the permission hook this is an unattended run, which it
        # answers for a write under .claude/.
        FACTORY_UNATTENDED: "1"
      run: |
        if [ -n "$OAUTH_TOKEN_INPUT" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN_INPUT"
        elif [ -n "$API_KEY_INPUT" ]; then
          export ANTHROPIC_API_KEY="$API_KEY_INPUT"
        fi
        unset OAUTH_TOKEN_INPUT API_KEY_INPUT
        args=(-p "$PROMPT" --max-turns 1000
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent,Task,Skill"
          --output-format stream-json --verbose)
        if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
        # One line for each thing the session says and each tool it runs,
        # then the turns, minutes, and cost.
        # The shell stops the session after MINUTES, so that a build that runs
        # out of time ends as a failed step and the job's last step still runs.
        timeout --kill-after=30s "${MINUTES}m" claude "${args[@]}" | jq --unbuffered -r '
          if .type == "assistant" then
            .message.content[]?
            | if .type == "text" then .text | gsub("\\s*\\n\\s*"; " ")
              elif .type == "tool_use" then
                "> \(.name): \((.input | to_entries | first | .value) // "" | tostring | gsub("\\s*\\n\\s*"; " ") | .[0:200])"
              else empty end
          elif .type == "system" and .subtype == "permission_denied" then
            "Denied: \(.tool_name): \((.decision_reason // .message // "") | tostring | gsub("\\s*\\n\\s*"; " ") | .[0:200])"
          elif .type == "result" then
            "Finished (\(.subtype)): \(.num_turns) turns, \((.duration_ms / 60000) | floor) minutes, $\(.total_cost_usd) at API list prices.",
            (.permission_denials[]? | "Denied: \(.tool_name): \((.tool_input | to_entries | first | .value) // "" | tostring | gsub("\\s*\\n\\s*"; " ") | .[0:200])")
          else empty end'

    - name: Put the checkout back on the commit the session started on
      if: always() && steps.gate.outputs.ran != 'false'
      shell: bash
      run: |
        file="$RUNNER_TEMP/factory-start-commit"
        if [ -f "$file" ]; then
          git checkout --force --detach "$(cat "$file")"
        fi
