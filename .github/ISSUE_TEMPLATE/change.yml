name: Change
description: A new feature, or a change to how lunamill works.
labels: [enhancement]
body:
  - type: textarea
    id: change
    attributes:
      label: What and why
      description: The change, and the problem it solves for someone using lunamill or setting it up.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: >-
        What you will see once it is finished: a command's output, a setting,
        or what lunamill writes into a repository. This is how the change
        will be judged done.
      placeholder: |
        - lunamill init asks which model the CI review uses
        - A repository set up with init has LUNAMILL_BUILD_MODEL set
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The commands, skills, or workflows it touches, if you know.
