# The coverage floors in vitest.config.ts are what block a merge, so
# Codecov's own checks only report.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
# The comment is posted only when the project's coverage drops; the
# review skill reads a missing one as normal, not as a failed upload.
comment:
  require_changes: "coverage_drop"
