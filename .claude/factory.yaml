# Settings for the software factory in its own repository. Every key is
# explained in docs/configuration.md.
version: 1
repository: davidbyoung/software-factory

# Where tickets live. This repository shares the board of the one the
# factory was drawn out of: each repository's sync and status read only
# its own cards.
tickets:
  type: github
  board: 1

# Builds start when a session is told to work a ticket. Moving a card to
# Ready starts nothing here.
builds:
  trigger: manual

# A change to what a factory user sees, such as a command's output, a
# setting, or what the factory writes into their repository, is specified
# with OpenSpec.
specs: openspec

# Commands run before every commit a session makes. If one fails, the
# commit is blocked.
before-commit:
  - npm run -s format:check
  - npx tsc --noEmit

# The automated review of every pull request, on while this is written.
# "commands" are what it may run to confirm a finding, beside reading the
# pull request and commenting on it.
ci-review:
  commands:
    - npm test
    - npm run typecheck
    - node
