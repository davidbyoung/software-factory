# Settings for the software factory in its own repository. Every key is
# explained under docs/reference/settings/.
version: 2
repository: kodor-ai/kodor

# Where tickets live. This repository shares the board of the one the
# factory was drawn out of: each repository's sync and status read only
# its own cards.
tickets:
  type: github
  board: 1
  # Which of the board's columns shows each state.
  columns:
    backlog: Backlog
    refining: In refinement
    ready: Ready
    building: In progress
    review: In review
    done: Done

# A build of ticket 12 pushes a branch named 12.
code-host:
  type: github
  branch-name: "{ticket}"

# Builds start when a session is told to work a ticket. Moving a card to
# Ready starts nothing here.
builds:
  trigger: manual

# A change to what a factory user sees, such as a command's output, a
# setting, or what the factory writes into their repository, is specified
# with OpenSpec.
specs: openspec

# Every command a build runs here, each from the repository's root.
commands:
  # Before every commit a session makes. If one fails, the commit is
  # blocked.
  before-commit:
    - npm run -s format:check
    - npx tsc --noEmit
  # Before a session reports a task done.
  gate:
    - npm run check
  # One unit test alone. An empty NAME runs the whole file.
  test-one: npx vitest run $FILE -t "$NAME"
  # The unit tests with coverage, which a review reads for untested lines.
  coverage:
    run: npm run coverage
    report: coverage/lcov.info

# The automated review of every pull request, on while this is written.
pr-review: true

# This repository's own reviewer: it reads a changed page of the docs as
# someone who has never seen the factory.
plugins:
  build:
    reviewers:
      - agent: docs-reader
        files:
          - README.md
          - docs/**
