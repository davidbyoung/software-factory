schema: spec-driven

# The project's rules live in CLAUDE.md and .claude/lunamill/rules.md. Point
# at them rather than copying them here, or the two drift apart.
context: |
  Follow CLAUDE.md and .claude/lunamill/rules.md. Write American English with
  the Oxford comma. This repository is lunamill itself: a spec
  here describes what a lunamill user sees, such as a command's output, a
  setting, or what lunamill writes into their repository.
  Changes come from GitHub issues refined by the lunamill-refine skill and built
  by the lunamill-build skill; see "Spec track" in .claude/lunamill/rules.md.

rules:
  proposal:
    - Link the GitHub issue the change comes from, and carry its Decisions.
  specs:
    - Each scenario is one numbered line of the issue's Spec section, in its
      own words, under the capability the issue names. Add no scenario the
      issue does not have, and reword none.
  tasks:
    - Include the tests, by file, beside the task each checks; a verify task
      mapping every scenario to its test; and the gate (npm run format,
      then npx --no-install lunamill gate).
